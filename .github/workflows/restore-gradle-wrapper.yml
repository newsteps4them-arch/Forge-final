name: Restore Gradle Wrapper - Complete Fix v2

on:
  workflow_dispatch:

concurrency:
  group: restore-gradle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Run capacitor sync to generate plugin files
        run: npx cap sync android || true
      
      - name: Delete old gradle-wrapper.jar
        run: |
          rm -f android/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/
      
      - name: Generate fresh gradle-wrapper.jar using gradlew
        run: |
          cd android
          chmod +x ./gradlew
          # Force gradle wrapper regeneration
          ./gradlew wrapper --gradle-version 8.7 --distribution-type bin
          cd ..
      
      - name: Verify gradle-wrapper.jar is valid
        run: |
          echo "=== Checking file type ==="
          file android/gradle/wrapper/gradle-wrapper.jar
          echo "=== Checking jar contents (first 10 entries) ==="
          jar tf android/gradle/wrapper/gradle-wrapper.jar | head -10
          echo "=== File size ==="
          ls -lh android/gradle/wrapper/gradle-wrapper.jar
      
      - name: Test build with assembleDebug
        run: |
          cd android
          ./gradlew clean assembleDebug
          cd ..
      
      - name: Commit and push gradle-wrapper.jar
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Restore valid gradle-wrapper.jar for Gradle 8.7"
            git push origin HEAD
          fi
