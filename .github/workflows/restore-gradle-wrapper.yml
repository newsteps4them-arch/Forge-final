name: Restore Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-gradle-wrapper-jar
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Download Gradle 8.7 distribution
        run: |
          mkdir -p /tmp/gradle-download
          cd /tmp/gradle-download
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          
      - name: Extract and restore gradle-wrapper.jar
        run: |
          mkdir -p android/gradle/wrapper
          cp /tmp/gradle-download/gradle-8.7/lib/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          
      - name: Verify JAR file
        run: |
          file android/gradle/wrapper/gradle-wrapper.jar
          jar tf android/gradle/wrapper/gradle-wrapper.jar | head -20
      
      - name: Test build
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      
      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Restore gradle-wrapper.jar for Gradle 8.7"
            git push origin fix/restore-gradle-wrapper-jar
          fi
