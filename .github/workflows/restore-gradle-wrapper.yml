name: Restore Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-gradle-wrapper-jar
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install npm dependencies first
        run: npm install
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Generate gradle-wrapper.jar using gradle wrapper command
        run: |
          cd android
          chmod +x ./gradlew
          # Use the local gradlew to generate the wrapper for Gradle 8.7
          ./gradlew wrapper --gradle-version 8.7 --distribution-type bin
          cd ..
      
      - name: Verify JAR file is valid
        run: |
          file android/gradle/wrapper/gradle-wrapper.jar
          jar tf android/gradle/wrapper/gradle-wrapper.jar | head -5
      
      - name: Clean build directory and test build
        run: |
          cd android
          ./gradlew clean
          ./gradlew assembleDebug
          cd ..
      
      - name: Commit and push gradle-wrapper.jar fix
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to gradle-wrapper.jar"
          else
            git commit -m "fix: Restore valid gradle-wrapper.jar for Gradle 8.7"
            git push origin fix/restore-gradle-wrapper-jar
          fi
