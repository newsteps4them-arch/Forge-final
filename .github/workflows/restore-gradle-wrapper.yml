name: Restore Gradle Wrapper - Complete Fix

on:
  workflow_dispatch:

jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-gradle-wrapper-jar
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install npm dependencies with verbose logging
        run: |
          npm install --verbose
          echo "=== Verifying @capacitor/android installation ==="
          ls -la node_modules/@capacitor/android/capacitor/ || echo "ERROR: @capacitor/android not found"
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Run capacitor sync to generate required files
        run: |
          npx cap sync android --verbose || true
          echo "=== Checking for capacitor-cordova-android-plugins ==="
          ls -la android/capacitor-cordova-android-plugins/ || echo "Not generated yet"
      
      - name: Verify node_modules structure before gradle
        run: |
          echo "=== Checking @capacitor/android/capacitor ==="
          test -d node_modules/@capacitor/android/capacitor && echo "✓ Found" || echo "✗ NOT FOUND"
          ls -la node_modules/@capacitor/android/ || true
      
      - name: Generate gradle-wrapper.jar
        run: |
          cd android
          chmod +x ./gradlew
          # Run gradle wrapper to generate the correct gradle-wrapper.jar
          ./gradlew wrapper --gradle-version 8.7 --distribution-type bin
          cd ..
      
      - name: Verify gradle-wrapper.jar
        run: |
          file android/gradle/wrapper/gradle-wrapper.jar
          jar tf android/gradle/wrapper/gradle-wrapper.jar | head -5
      
      - name: Test assembleDebug build
        run: |
          cd android
          ./gradlew clean assembleDebug
          cd ..
      
      - name: Commit gradle-wrapper.jar if changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Restore valid gradle-wrapper.jar for Gradle 8.7"
            git push origin fix/restore-gradle-wrapper-jar
          fi
