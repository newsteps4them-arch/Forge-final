name: Restore Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  restore-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-gradle-wrapper-jar
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install npm dependencies
        run: npm install
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Download gradle-wrapper.jar from official Gradle GitHub
        run: |
          mkdir -p android/gradle/wrapper
          cd android/gradle/wrapper
          # Download the official gradle-wrapper.jar from Gradle's GitHub repository
          wget https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -O gradle-wrapper.jar
          cd /home/runner/work/team.forge/team.forge
          
      - name: Verify JAR file
        run: |
          file android/gradle/wrapper/gradle-wrapper.jar
          jar tf android/gradle/wrapper/gradle-wrapper.jar | head -20
      
      - name: Test build with gradlew
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version
          
      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Restore gradle-wrapper.jar from official Gradle repository"
            git push origin fix/restore-gradle-wrapper-jar
          fi
