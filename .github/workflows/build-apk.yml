name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Synchronize Env Secrets
        run: |
          chmod +x ./scripts/sync-env.sh
          ./scripts/sync-env.sh
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}

      - name: Build Web App
        run: npm run static-build

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: false

      - name: Run Gradle Compile (All Targets)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          
          # Debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then cp "$DEBUG_APK" "artifacts/Forge-debug.apk"; fi
          
          # Release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then cp "$RELEASE_APK" "artifacts/Forge-release-unsigned.apk"; fi
          
          # Release AAB (App Bundle)
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then cp "$RELEASE_AAB" "artifacts/Forge-production-release.aab"; fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-ci-build-artifacts
          path: artifacts/*
          retention-days: 14
