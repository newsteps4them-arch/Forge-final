name: Forge-Final CI/CD

on:
  push:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - run: npm audit fix --prefer-offline 2>/dev/null || true
      - run: npm install 2>/dev/null || true
      - name: Commit auto-fixes
        run: |
          git config --global user.email "forge-bot@github.com"
          git config --global user.name "Forge Bot"
          if [ -n "$(git status -s)" ]; then
            git add -A
            git commit -m "[Auto-Fix] CI pipeline fixes" || true
            git push || true
          fi
        continue-on-error: true
