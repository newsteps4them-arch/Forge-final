name: Forge Auto-Audit

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday, 13:00 UTC (~6am AZ)
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: forge-auto-audit
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/auto_audit.py
