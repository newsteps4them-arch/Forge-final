name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Synchronize Env Secrets
        run: |
          chmod +x ./scripts/sync-env.sh
          ./scripts/sync-env.sh
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_FIRESTORE_DATABASE_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}

      - name: Build web assets
        run: npm run static-build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version || '1.0.0')")
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Build APK and App Bundle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Locate and Rename Artifacts
        run: |
          mkdir -p artifacts
          
          # Find and copy Debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk"
            echo "Found debug APK: $DEBUG_APK"
          else
            echo "Warning: Debug APK not found"
          fi
          
          # Find and copy Release APK  
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk"
            echo "Found release APK: $RELEASE_APK"
          else
            echo "Warning: Release APK not found"
          fi
          
          # Find and copy Release AAB
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab"
            echo "Found release AAB: $RELEASE_AAB"
          else
            echo "Warning: Release AAB not found"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Forge-debug-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-release-unsigned-${{ steps.version.outputs.version }}.apk
            artifacts/Forge-production-release-${{ steps.version.outputs.version }}.aab
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.timestamp }}
          body: |
            # Forge Production & Staging Release (v${{ steps.version.outputs.version }})
            
            **Version:** ${{ steps.version.outputs.version }}
            **Build Date:** ${{ steps.version.outputs.timestamp }}
            
            ## 📦 Build Artifacts
            - **Google Play App Bundle (AAB):** `Forge-production-release-${{ steps.version.outputs.version }}.aab` (Ready for upload/signing in Google Play Console)
            - **Sideloadable Release APK:** `Forge-release-unsigned-${{ steps.version.outputs.version }}.apk` (Full production build, manually/automatically sign before device install)
            - **Interim Debug APK:** `Forge-debug-${{ steps.version.outputs.version }}.apk` (Pre-signed; install instantly on diagnostic devices for sandbox/staging testing)
            
            ## 📲 Sideload Sandbox Installation
            1. Download the **Debug APK** below.
            2. On your Android device, go to Settings > Security and enable **Allow installation from unknown sources** / **Allow Unknown Apps**.
            3. Open the APK file and tap **Install**.
            
            **Release Notes:**
            - Automatic multi-build pipeline generated on: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APKs and AAB as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-production-ready-artifacts
          path: artifacts/*
          retention-days: 30
