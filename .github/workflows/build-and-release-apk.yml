name: Build and Release Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run static-build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create keystore from secrets
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/forge-final-keystore.jks
          ls -lh ${{ github.workspace }}/forge-final-keystore.jks

      - name: Create gradle.properties with signing config
        run: |
          cat > ${{ github.workspace }}/android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          
          # Signing configuration
          KEYSTORE_PATH=${{ github.workspace }}/forge-final-keystore.jks
          KEYSTORE_PASSWORD=${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF

      - name: Setup signing config in build.gradle
        run: |
          cd ${{ github.workspace }}/android/app
          
          # Check if signingConfigs block exists, if not add it
          if ! grep -q "signingConfigs" build.gradle; then
            cat >> build.gradle << 'EOF'
          
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH") ?: "forge-final-keystore.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF
          fi

      - name: Build signed release APK
        run: |
          cd ${{ github.workspace }}/android
          ./gradlew assembleRelease --info
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/forge-final-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK_PATH="${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found at: $APK_PATH"
            ls -lh "$APK_PATH"
            echo ""
            echo "Verifying signature..."
            jarsigner -verify -verbose "$APK_PATH"
          else
            echo "❌ Error: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Get version and date
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK_PATH="${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "Forge-final-v${{ steps.version.outputs.version }}.apk"
            ls -lh Forge-final-v*.apk
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: Forge-final-v*.apk
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.version.outputs.timestamp }}
          body: |
            # 🚀 Forge Final - Production Release
            
            **Version:** ${{ steps.version.outputs.version }}  
            **Build Date:** ${{ steps.version.outputs.date }}  
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            ## ✨ What's Included
            - ✅ **Digitally Signed** - Production-ready with release signing key
            - ✅ **Optimized** - Built for performance
            - ✅ **Ready for Play Store** - Can be submitted to Google Play Store
            
            ## 📱 Installation Instructions
            
            ### For Testing (Sideload):
            1. Download the APK file (`Forge-final-v*.apk`) from this release
            2. On your Android device, go to:
               - **Settings > Security > Allow installation from unknown sources** (Android < 8), OR
               - **Settings > Apps & notifications > Advanced > Special app access > Install unknown apps > Choose your browser/file manager** (Android 8+)
            3. Open the downloaded APK file
            4. Tap **Install**
            5. Launch the app from your home screen
            
            ### For Production (Google Play Store):
            This APK is ready for submission to the Google Play Store. Use this in your Play Console release.
            
            ## 🔐 Security Information
            - **Signature:** Digitally signed with your release signing key
            - **Status:** Production-ready
            - **Recommended for:** Distribution via Google Play Store or direct installation
            
            ## 📋 Troubleshooting
            - If installation fails, ensure unknown sources are enabled
            - On Android 12+, you may need to grant install permission to your file manager
            - Verify your Android version matches the app requirements
            
            ---
            
            **Questions?** Visit the [repository](https://github.com/${{ github.repository }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-final-signed-apk
          path: Forge-final-v*.apk
          retention-days: 90
          compression-level: 0

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ${{ github.workspace }}/forge-final-keystore.jks
          echo "✅ Keystore removed from runner"
